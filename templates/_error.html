{{#error}}
	<div class="wrapper">
		<div class="screen">
			<div class="container">
				<div class="icon las la-exclamation-triangle"></div>
				<div class="title">{{title}}</div>
				<div class="line"></div>
				<div class="info">
					<p>{{info}}</p>
				</div>
			</div>
		</div>
	</div>
{{/error}}
{{^error}}
	<div class="wrapper">
		<div class="screen">
			<div class="container">
				<div class="icon las la-exclamation-triangle"></div>
				<div class="title">Unbekannter Fehler</div>
				<div class="line"></div>
				<div class="info">
					<p>Das hätte nicht passieren sollen.</p>
					{{#exception}}<p><code>{{.}}</code></p>{{/exception}}
				</div>
				<a class="button" href="/launcher/start">App neustarten</a>
			</div>
		</div>
	</div>
{{/error}}
